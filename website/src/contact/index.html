<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — RideBuddy</title>
<meta name="description" content="Write to RideBuddy at support@ridebuddy.co.in, join the waitlist for when booking opens, or apply to drive as a Buddy.">
<meta name="theme-color" content="#F5F0E8">
<link rel="icon" href="/logomark.svg" type="image/svg+xml">
<meta property="og:title" content="Contact — RideBuddy">
<meta property="og:description" content="Write to us, join the waitlist, or apply to drive with RideBuddy.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ridebuddy.co.in/contact/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__DS_DIR__/styles.css">
<link rel="stylesheet" href="/shared/site.css">
</head>
<body data-page="contact">
<!-- SiteHeader (shared/header.jsx) renders the full header here; the logo shows while scripts load. -->
<header class="rb-header" id="rb-header">
  <div class="rb-header__in">
    <a class="rb-brand" href="__HOME__" aria-label="RideBuddy home">
      <img src="/logomark.svg" alt="">
      <span>RideBuddy</span>
    </a>
  </div>
</header>
<main>
  <section class="rb-section rb-contact" data-screen-label="Contact">
    <div class="rb-wrap rb-wrap--720">
      <h1 class="rb-h1">Write to us.</h1>
      <div class="rb-box rb-email">
        <span>Email</span>
        <a href="mailto:support@ridebuddy.co.in">support@ridebuddy.co.in</a>
      </div>
      <!-- The waitlist card (shared/waitlist.jsx ContactWaitlist): the number goes in right here. -->
      <div class="rb-box" id="rb-contact-waitlist"></div>
    </div>
  </section>

  <section class="rb-buddyband" data-screen-label="Contact — Become a Buddy">
    <div class="rb-wrap rb-buddyband__in">
      <div class="rb-buddyband__text">
        <span class="rb-eyebrow">Become a Buddy</span>
        <h2>Drive with RideBuddy.</h2>
        <p>Outstation trips across North India, on your terms.</p>
      </div>
      <button type="button" class="rb-btn rb-btn--primary" data-rb-apply>
        Apply to be a Buddy
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>
<!-- partial:closer -->
<!-- partial:footer -->
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="__DS_DIR__/_ds_bundle.js"></script>
<script src="/shared/pages.js"></script>
</body>
</html>
